<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frau Elsa - AI Tutor Němčiny (Offline Mode)</title>
    <style>
        /* ČISTÉ LOKÁLNÍ STYLY - NEZÁVISLÉ NA EXTERNÍM TAILWINDU */
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --border-dark: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --brand-color: #e11d48;
            --brand-hover: #be123c;
            --emerald-bg: rgba(16, 185, 129, 0.1);
            --emerald-text: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Horní lišta */
        header {
            background-color: var(--card-dark);
            border-b: 1px solid var(--border-dark);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-dark);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--brand-color);
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
        }

        .badge {
            background-color: rgba(225, 29, 72, 0.2);
            color: #f43f5e;
            border: 1px solid rgba(225, 29, 72, 0.3);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            margin-left: 6px;
        }

        .header-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .btn-top {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-dark);
            color: var(--text-main);
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: border 0.2s;
        }

        .btn-top:hover {
            border-color: var(--brand-color);
        }

        /* Hlavní pracovní plocha */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Levý panel s tématy */
        aside {
            width: 320px;
            background-color: var(--card-dark);
            border-r: 1px solid var(--border-dark);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-r: 1px solid var(--border-dark);
            overflow-y: auto;
        }

        .profile-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .profile-card img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--brand-color);
            margin-bottom: 12px;
        }

        .profile-card h2 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-card p {
            font-size: 12px;
            color: var(--brand-color);
            font-style: italic;
            margin-bottom: 10px;
        }

        .status-online {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--emerald-text);
            background-color: var(--emerald-bg);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--emerald-text);
            border-radius: 50%;
        }

        .nav-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .topic-group-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--brand-color);
            margin: 10px 0 4px 0;
            opacity: 0.8;
        }

        .topic-btn {
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-dark);
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topic-btn:hover {
            border-color: rgba(225, 29, 72, 0.5);
            color: var(--text-main);
        }

        .topic-btn.active {
            border-color: var(--brand-color);
            background-color: rgba(225, 29, 72, 0.1);
            color: var(--text-main);
            font-weight: 500;
        }

        /* Pravá chatovací část */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
        }

        .banner-topic {
            background-color: rgba(30, 41, 59, 0.4);
            border-bottom: 1px solid var(--border-dark);
            padding: 10px 24px;
            font-size: 12px;
            font-weight: 600;
            color: var(--brand-color);
        }

        .banner-topic span {
            color: var(--text-main);
            margin-left: 4px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Bubliny zpráv */
        .msg-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            max-width: 700px;
        }

        .msg-row.user {
            margin-left: auto;
            justify-content: flex-end;
        }

        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--brand-color);
            flex-shrink: 0;
        }

        .msg-bubble {
            background-color: var(--card-dark);
            border: 1px solid var(--border-dark);
            padding: 16px;
            border-radius: 16px;
            border-top-left-radius: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-1: 1;
        }

        .msg-row.user .msg-bubble {
            background-color: rgba(225, 29, 72, 0.1);
            border-color: rgba(225, 29, 72, 0.3);
            border-top-left-radius: 16px;
            border-top-right-radius: 0;
            text-align: right;
        }

        .msg-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .msg-name {
            font-weight: 600;
            color: var(--brand-color);
        }

        .msg-role {
            font-size: 10px;
            color: var(--text-muted);
            background-color: var(--bg-dark);
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-dark);
        }

        .msg-text {
            font-size: 14px;
            line-height: 1.5;
            font-weight: 500;
        }

        .btn-translate {
            background: none;
            border: none;
            color: var(--brand-color);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            padding: 2px 0;
            width: fit-content;
        }

        .translation-box {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(51, 65, 85, 0.4);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-muted);
            font-style: italic;
        }

        .correction-box {
            background-color: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            color: #fcd34d;
            line-height: 1.4;
        }

        /* Spodní nápovědy */
        .hints-panel {
            background-color: var(--card-dark);
            border-top: 1px solid var(--border-dark);
            padding: 16px;
        }

        .hints-heading {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        .hints-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        @media (max-width: 768px) {
            .hints-grid {
                grid-template-columns: 1fr;
            }
        }

        .hint-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-dark);
