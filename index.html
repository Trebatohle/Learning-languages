<!DOCTYPE html>
<html lang="cs" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frau Elsa - AI Tutor Němčiny (Offline Branching)</title>
    <!-- Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            900: '#881337',
                        },
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155',
                            text: '#f8fafc',
                            muted: '#94a3b8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #e11d48; }
    </style>
</head>
<body class="h-full flex flex-col font-sans antialiased overflow-hidden">

    <!-- Top Navigation -->
    <header class="bg-dark-card border-b border-dark-border px-6 py-3 flex items-center justify-between z-10">
        <div class="flex items-center space-x-3">
            <div class="relative">
                <img src="https://unsplash.com" alt="Frau Elsa" class="w-10 h-10 rounded-full object-cover border-2 border-brand-600">
                <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-dark-card rounded-full"></span>
            </div>
            <div>
                <h1 class="font-display font-bold text-lg flex items-center gap-2">
                    Frau Elsa 
                    <span class="bg-brand-600/20 text-brand-500 border border-brand-600/30 text-xs px-2 py-0.5 rounded font-mono">OFFLINE VERSION</span>
                </h1>
                <p class="text-xs text-dark-muted">Lokální trenažér větvených konverzací (A1)</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button id="speechToggleBtn" onclick="toggleSpeech()" class="px-3 py-1.5 bg-dark-bg border border-dark-border hover:border-brand-600 text-xs font-medium rounded-lg transition-colors flex items-center gap-2">
                <i id="volumeIcon" class="fas fa-volume-up text-brand-500"></i>
                <span id="volumeStatus">Hlas zapnut</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar - Left (40 Topics grouped) -->
        <aside class="w-80 bg-dark-card border-r border-dark-border p-4 flex flex-col justify-between hidden md:flex overflow-y-auto">
            <div class="space-y-4">
                <!-- Profile Summary Card -->
                <div class="bg-dark-bg p-4 rounded-xl border border-dark-border text-center relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-b from-brand-600/10 to-transparent pointer-events-none"></div>
                    <img src="https://unsplash.com" alt="Frau Elsa" class="w-24 h-28 mx-auto rounded-full object-cover border-4 border-brand-600 shadow-lg shadow-brand-600/20 mb-3">
                    <h2 class="font-display font-bold text-base text-white">Frau Elsa</h2>
                    <p class="text-[11px] text-brand-500 italic mb-2">"Hallo! Ich bin Elsa. Lass uns lernen!"</p>
                    <div class="inline-flex items-center gap-1.5 text-[10px] text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-0.5 rounded-full">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        100% Offline
                    </div>
                </div>

                <!-- Topic Selector Container -->
                <div>
                    <h3 class="text-[10px] font-bold text-dark-muted uppercase tracking-wider mb-2 px-1">Seznam 40 témat (A1)</h3>
                    <div class="space-y-3" id="topicGroupsContainer">
                        <!-- Skupiny témat se vygenerují přes JS -->
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Engine -->
        <main class="flex-1 flex flex-col bg-dark-bg relative">
            <!-- Current Topic Title Banner -->
            <div class="bg-dark-card/40 border-b border-dark-border px-6 py-2 text-xs font-semibold text-brand-500 flex items-center gap-2">
                <i class="fas fa-graduation-cap"></i> Aktuální téma: <span id="currentTopicTitle" class="text-white">1. Pozdravy & Představení se</span>
            </div>
            
            <!-- Messages Scroll Area -->
            <div class="flex-1 overflow-y-auto p-6 space-y-4" id="chatContainer"></div>

            <!-- Recommended Hints Section -->
            <div class="bg-dark-card border-t border-dark-border p-4">
                <p class="text-xs font-semibold text-dark-muted uppercase tracking-wider mb-2 px-1">✦ Tři možnosti jak odpovědět (kliknutím odešlete):</p>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3" id="hintsContainer">
                    <button onclick="useHint(0)" id="hintBtn0" class="text-left bg-dark-bg hover:bg-dark-border p-3 rounded-xl border border-dark-border transition-all group"></button>
                    <button onclick="useHint(1)" id="hintBtn1" class="text-left bg-dark-bg hover:bg-dark-border p-3 rounded-xl border border-dark-border transition-all group"></button>
                    <button onclick="useHint(2)" id="hintBtn2" class="text-left bg-dark-bg hover:bg-dark-border p-3 rounded-xl border border-dark-border transition-all group"></button>
                </div>
            </div>

            <!-- Input Bar -->
            <div class="p-4 bg-dark-card border-t border-dark-border flex items-center gap-3">
                <button onclick="simulateVoiceInput()" class="w-10 h-10 rounded-xl bg-dark-bg border border-dark-border text-dark-muted hover:text-brand-500 transition-colors flex items-center justify-center" title="Simulovat mluvení">
                    <i class="fas fa-microphone text-lg"></i>
                </button>
                <input type="text" id="userInput" onkeypress="handleKeyPress(event)" placeholder="Napište německou odpověď..." class="flex-1 bg-dark-bg border border-dark-border rounded-xl px-4 py-2.5 text-sm text-white placeholder-dark-muted focus:outline-none focus:border-brand-600 transition-colors">
                <button onclick="processUserResponse()" class="bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm px-5 py-2.5 rounded-xl transition-colors flex items-center gap-2">
                    Odeslat <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </div>
        </main>
    </div>

    <script>
        // 40 TÉMAT: Kompletní offline konverzační databáze s uzly, překlady, nápovědami a gramatickými pastmi.
        const topicsDatabase = {
            // SKUPINA 1: OSOBNÍ INFORMACE & SEZNÁMENÍ
            1: { name: "1. Pozdravy & seznámení", icon: "fa-comments", color: "text-brand-500", startNode: "t1_n1", nodes: {
                "t1_n1": { bot_de: "Hallo! Ich heiße Elsa. Wie heißt du?", bot_cz: "Ahoj! Jmenuji se Elsa. Jak se jmenuješ?", hints: [{de:"Ich heiße Max.", cz:"Jmenuji se Max."}, {de:"Mein Name ist Lukas.", cz:"Mé jméno je Lukas."}, {de:"Ich bin Anna, und du?", cz:"Já jsem Anna, a ty?"}], traps: [{trigger:"ich heisse ist", fix:"Pozor na slovesa! Říká se buď 'Ich heiße Max' nebo 'Mein Name ist Max'."}], next: "t1_n2" },
                "t1_n2": { bot_de: "Freut mich! Und wie alt bist du?", bot_cz: "Těší mě! A kolik je ti let?", hints: [{de:"Ich bin 25 Jahre alt.", cz:"Je mi 25 let."}, {de:"Ich bin 30.", cz:"Je mi 30."}, {de:"Ich bin 18.", cz:"Je mi 18."}], traps: [{trigger:"ich habe", fix:"Věk se v němčině pojí se slovesem 'sein' (být), ne 'haben' (mít). Správně: 'Ich bin 25'."}], next: "t1_end" },
                "t1_end": { bot_de: "Super! Das war ein tolles Kennenlernen. Danke!", bot_cz: "Super! To bylo skvělé seznámení. Děkuji!", hints: [{de:"Danke auch!", cz:"Také děkuji!"}, {de:"Bitte sehr.", cz:"Prosím pěkně."}, {de:"Tschüss!", cz:"Ahoj! (při loučení)"}], traps: [], next: "t1_n1" }
            }},
            2: { name: "2. Moje rodina", icon: "fa-users", color: "text-blue-400", startNode: "t2_n1", nodes: {
