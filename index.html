<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frau Elsa - AI Tutor Němčiny</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-chat: #0f172a;
            --primary: #e11d48;
            --primary-hover: #be123c;
            --accent: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --user-msg: #9f1239;
            --elsa-msg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            background-color: var(--bg-card);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-mini {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
        }

        .brand-text h1 {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: var(--primary);
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .brand-text p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-control {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-control:hover {
            border-color: var(--primary);
        }

        /* Layout */
        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left Sidebar */
        .sidebar-left {
            width: 320px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .tutor-card {
            text-align: center;
            background: var(--bg-main);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .tutor-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
            border: 3px solid var(--primary);
            box-shadow: 0 0 15px rgba(225, 29, 72, 0.3);
        }

        .tutor-card h2 {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .tutor-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 10px;
        }

        .status-online {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #10b981;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
        }

        .topics-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .topics-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .topic-btn {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .topic-btn:hover, .topic-btn.active {
            border-color: var(--primary);
            background: rgba(225, 29, 72, 0.1);
        }

        /* Main Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-main);
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
        }

        .message-content {
            background: var(--elsa-msg);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
        }

        .message.user .message-content {
            background: var(--user-msg);
            border-color: var(--primary);
        }

        .message-text {
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .message-translation {
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px dashed var(--border);
            padding-top: 6px;
            margin-top: 6px;
        }

        .btn-translate {
            font-size: 0.75rem;
            color: var(--accent);
            background: none;
            border: none;
            cursor: pointer;
            margin-top: 4px;
        }

        /* Bottom Controls & Quick Replies */
        .bottom-panel {
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .quick-replies {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .quick-btn {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            border-color: var(--primary);
            background: rgba(225, 29, 72, 0.1);
        }

        .quick-de {
            font-weight: bold;
            font-size: 0.85rem;
            color: #fecdd3;
            margin-bottom: 2px;
        }

        .quick-cs {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .mic-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .mic-btn.recording {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .text-input {
            flex: 1;
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 24px;
            outline: none;
            font-size: 0.95rem;
        }

        .text-input:focus {
            border-color: var(--primary);
        }

        .send-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Right Sidebar - Vocab */
        .sidebar-right {
            width: 280px;
            background-color: var(--bg-card);
            border-left: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        .vocab-item {
            background: var(--bg-main);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vocab-de {
            font-weight: bold;
            font-size: 0.85rem;
        }

        .vocab-cs {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .vocab-play {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
        }
    </style>
</head>
<body>

            <div class="brand-text">
                <h1>Frau Elsa <span class="badge">AI TUTOR A1</span></h1>
