<!DOCTYPE html>
<html lang="cs" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frau Elsa - AI Tutor Němčiny (Offline Branching)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            900: '#881337',
                        },
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155',
                            text: '#f8fafc',
                            muted: '#94a3b8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #e11d48; }
    </style>
</head>
<body class="h-full flex flex-col font-sans antialiased overflow-hidden">

    <!-- Top Navigation -->
    <header class="bg-dark-card border-b border-dark-border px-6 py-3 flex items-center justify-between z-10">
        <div class="flex items-center space-x-3">
            <div class="relative">
                <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=300&q=80" alt="Frau Elsa" class="w-10 h-10 rounded-full object-cover border-2 border-brand-600">
                <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-dark-card rounded-full"></span>
            </div>
            <div>
                <h1 class="font-display font-bold text-lg flex items-center gap-2">
                    Frau Elsa 
                    <span class="bg-brand-600/20 text-brand-500 border border-brand-600/30 text-xs px-2 py-0.5 rounded font-mono">OFFLINE MODE</span>
                </h1>
                <p class="text-xs text-dark-muted">Inteligentní osobní lektorka němčiny (A1)</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button id="speechToggleBtn" onclick="toggleSpeech()" class="px-3 py-1.5 bg-dark-bg border border-dark-border hover:border-brand-600 text-xs font-medium rounded-lg transition-colors flex items-center gap-2">
                <i id="volumeIcon" class="fas fa-volume-up text-brand-500"></i>
                <span id="volumeStatus">Hlas zapnut</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar - Left (Topics) -->
        <aside class="w-80 bg-dark-card border-r border-dark-border p-5 flex flex-col justify-between hidden md:flex">
            <div class="space-y-6">
                <!-- Profile Summary Card -->
                <div class="bg-dark-bg p-4 rounded-xl border border-dark-border text-center relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-b from-brand-600/10 to-transparent pointer-events-none"></div>
                    <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=500&q=80" alt="Frau Elsa" class="w-28 h-28 mx-auto rounded-full object-cover border-4 border-brand-600 shadow-lg shadow-brand-600/20 mb-3">
                    <h2 class="font-display font-bold text-lg text-white">Frau Elsa</h2>
                    <p class="text-xs text-brand-500 italic mb-2">"Hallo! Ich bin Elsa. Schön dich zu sehen!"</p>
                    <div class="inline-flex items-center gap-2 text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        Připravena k mluvení
                    </div>
                </div>

                <!-- Topic Selector -->
                <div>
                    <h3 class="text-xs font-semibold text-dark-muted uppercase tracking-wider mb-3 px-1">Konverzační témata (A1)</h3>
                    <nav class="space-y-1.5" id="topicNav">
                        <button onclick="changeTopic('start')" class="w-full text-left px-3.5 py-2.5 rounded-lg border border-brand-600 bg-brand-600/10 text-white font-medium text-sm flex items-center gap-3 transition-all">
                            <i class="fas fa-comments text-brand-500 w-4"></i> 1. Pozdravy & Představení
                        </button>
                        <button onclick="changeTopic('restaurace')" class="w-full text-left px-3.5 py-2.5 rounded-lg border border-dark-border bg-dark-bg/50 text-dark-muted hover:text-white font-medium text-sm flex items-center gap-3 transition-all">
                            <i class="fas fa-coffee text-amber-500 w-4"></i> 2. V kavárně & restauraci
                        </button>
                    </nav>
                </div>
            </div>
        </aside>

        <!-- Main Chat Engine -->
        <main class="flex-1 flex flex-col bg-dark-bg relative">
            
            <!-- Messages Scroll Area -->
            <div class="flex-1 overflow-y-auto p-6 space-y-4" id="chatContainer">
                <!-- Zprávy budou generovány dynamicky sem -->
            </div>

            <!-- Recommended Hints Section -->
            <div class="bg-dark-card border-t border-dark-border p-4">
                <p class="text-xs font-semibold text-dark-muted uppercase tracking-wider mb-2 px-1">✦ Doporučené rychlé odpovědi podle kontextu:</p>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3" id="hintsContainer">
                    <button onclick="useHint(0)" id="hintBtn0" class="text-left bg-dark-bg hover:bg-dark-border p-3 rounded-xl border border-dark-border transition-all group"></button>
                    <button onclick="useHint(1)" id="hintBtn1" class="text-left bg-dark-bg hover:bg-dark-border p-3 rounded-xl border border-dark-border transition-all group"></button>
                    <button onclick="useHint(2)" id="hintBtn2" class="text-left bg-dark-bg hover:bg-dark-border p-3 rounded-xl border border-dark-border transition-all group"></button>
                </div>
            </div>

            <!-- Input Bar -->
            <div class="p-4 bg-dark-card border-t border-dark-border flex items-center gap-3">
                <button class="w-10 h-10 rounded-xl bg-dark-bg border border-dark-border text-dark-muted hover:text-brand-500 transition-colors flex items-center justify-center">
                    <i class="fas fa-microphone text-lg"></i>
                </button>
                <input type="text" id="userInput" onkeypress="handleKeyPress(event)" placeholder="Napište nebo řekněte zprávu..." class="flex-1 bg-dark-bg border border-dark-border rounded-xl px-4 py-2.5 text-sm text-white placeholder-dark-muted focus:outline-none focus:border-brand-600 transition-colors">
                <button onclick="processUserResponse()" class="bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm px-5 py-2.5 rounded-xl transition-colors flex items-center gap-2">
                    Odeslat <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </div>
        </main>
    </div>

    <script>
        // DATA: Strom konverzace pro zkušební témata A1
        const conversationTree = {
            "start": {
                "bot_de": "Hallo! Ich heiße Elsa. Schön, dass du da bist! Wie heißt du?",
                "bot_cz": "Ahoj! Jmenuji se Elsa. Jsem ráda, že jsi tu! Jak se jmenuješ?",
                "hints": [
                    {"de": "Ich heiße Max.", "cz": "Jmenuji se Max."},
                    {"de": "Mein Name ist Lukas.", "cz": "Mé jméno je Lukas."},
                    {"de": "Ich bin Anna, und du?", "cz": "Já jsem Anna, a ty?"}
                ],
                "traps": [
                    { "trigger": "ich heisse ist", "fix": "Pozor na kombinaci sloves! Nemůžeš říct 'ich heiße ist' (jmenuji se je). Správně je buď 'Ich heiße Max' nebo 'Mein Name ist Max'." }
                ],
                "next": "otazka_vek"
            },
            "otazka_vek": {
                "bot_de": "Freut mich! Und wie alt bist du?",
                "bot_cz": "Těší mě! A jak jsi starý/á?",
                "hints": [
                    {"de": "Ich bin 25 Jahre alt.", "cz": "Je mi 25 let."},
                    {"de": "Ich bin 30.", "cz": "Je mi 30."},
                    {"de": "Ich bin 18 Jahre alt.", "cz": "Je mi 18 let."}
                ],
                "traps": [
                    { "trigger": "ich habe", "fix": "Chyba v doslovném překladu! V němčině věk nevlastníš (nemáš), ale jsi starý. Místo 'Ich habe 25' musíte použít sloveso sein: 'Ich bin 25'." }
                ],
                "next": "konec_seznameni"
            },
            "konec_seznameni": {
                "bot_de": "Das ist super! Vielen Dank. Lass uns jetzt über ein anderes Thema sprechen.",
