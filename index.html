<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mia - AI Deutschlehrerin (A1)</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --chat-bot-bg: #2c2c2c;
            --chat-user-bg: #0d47a1;
            --text-color: #ffffff;
            --accent-color: #ffb300;
            --error-color: #ff5252;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Záhlaví aplikace */
        .header {
            background-color: var(--panel-bg);
            padding: 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50px;
            background-color: #aaa;
            margin-right: 15px;
            border: 2px solid var(--accent-color);
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-info h1 {
            margin: 0;
            font-size: 16px;
            font-weight: bold;
        }

        .header-info p {
            margin: 3px 0 0 0;
            font-size: 12px;
            color: #4caf50;
        }

        /* Oblast chatu */
        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.4;
            font-size: 15px;
        }

        .msg-bot {
            background-color: var(--chat-bot-bg);
            align-self: flex-start;
            border-top-left-radius: 0;
        }

        .msg-user {
            background-color: var(--chat-user-bg);
            align-self: flex-end;
            border-top-right-radius: 0;
        }

        .translation-toggle {
            color: var(--accent-color);
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
            display: inline-block;
            font-weight: bold;
            user-select: none;
        }

        .translation-text {
            color: #b0bec5;
            font-size: 13px;
            font-style: italic;
            margin-top: 5px;
            display: none;
        }

        .correction-box {
            background-color: rgba(255, 82, 82, 0.1);
            border-left: 4px solid var(--error-color);
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 13px;
        }

        /* Sekce nápověd (3 tlačítka) */
        .hints-section {
            background-color: #1a1a1a;
            padding: 12px;
            border-top: 1px solid #333;
        }

        .hints-title {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
            padding-left: 5px;
        }

        .hints-container {
            display: flex;
            gap: 8px;
        }

        .hint-btn {
            flex: 1;
            background-color: #3a3a3a;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .hint-btn:hover {
            background-color: #4a4a4a;
        }

        /* Spodní panel vstupu */
        .input-panel {
            background-color: var(--panel-bg);
            padding: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-field {
            flex: 1;
            background-color: #2c2c2c;
            border: none;
            padding: 12px 16px;
            border-radius: 24px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .btn-send {
            background-color: #2196f3;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- 1. ZÁHLAVÍ -->
    <div class="header">
        <div class="avatar">
            <!-- Placeholder pro fotku atraktivní blondýnky -->
            <img src="https://unsplash.com" alt="Mia">
        </div>
        <div class="header-info">
            <h1>Mia - AI Deutschlehrerin</h1>
            <p>Niveau A1 • 1. Pozdravy & Seznámení</p>
        </div>
    </div>

    <!-- 2. CHATOVÉ OKNO -->
    <div class="chat-area" id="chatArea">
        <!-- Zprávy se budou generovat dynamicky pomocí JS -->
    </div>

    <!-- 3. SEKCE 3 NÁPOVĚD -->
    <div class="hints-section">
        <div class="hints-title">Nevíš jak odpovědět? Klikni na nápovědu:</div>
        <div class="hints-container" id="hintsContainer">
            <button class="hint-btn" onclick="useHint(0)" id="hint0">-</button>
            <button class="hint-btn" onclick="useHint(1)" id="hint1">-</button>
            <button class="hint-btn" onclick="useHint(2)" id="hint2">-</button>
        </div>
    </div>

    <!-- 4. VSTUPNÍ PANEL -->
    <div class="input-panel">
        <input type="text" class="input-field" id="userInput" placeholder="Napiš německou odpověď..." onkeypress="handleKeyPress(event)">
        <button class="btn-send" onclick="processUserResponse()">➔</button>
    </div>

    <script>
        // DATA: Konverzační offline strom úrovně A1
        const conversationTree = {
            "start": {
                "bot_de": "Hallo! Ich heiße Mia. Wie heißt du?",
                "bot_cz": "Ahoj! Jmenuji se Mia. Jak se jmenuješ?",
                "hints": ["Ich heiße Max.", "Mein Name ist Lukas.", "Ich bin Anna."],
                "traps": [
                    { "trigger": "ich heisse ist", "fix": "Pozor! Nemůžeš kombinovat 'ich heiße' a 'ist'. Správně je buď 'Ich heiße Max' nebo 'Mein Name ist Max'." },
                    { "trigger": "mein name", "fix": "Nezapomeň, že v němčině se všechna podstatná jména píší velkým písmenem: 'Mein Name ist...'" }
                ],
                "next": "otazka_vek"
            },
            "otazka_vek": {
                "bot_de": "Freut mich! Und wie alt bist du?",
                "bot_cz": "Těší mě! A jak jsi starý/á?",
                "hints": ["Ich bin 20 Jahre alt.", "Ich bin 25.", "Ich bin 30 Jahre alt."],
                "traps": [
                    { "trigger": "ich habe", "fix": "Chyba v doslovném překladu! V němčině věk nevlastníš (nemáš), ale 'jsi' starý. Použij sloveso sein: 'Ich bin 25 Jahre alt'." }
                ],
                "next": "otazka_bydliste"
            },
            "otazka_bydliste": {
                "bot_de": "Interessant! Und wo wohnst du?",
                "bot_cz": "Zajímavé! A kde bydlíš?",
                "hints": ["Ich wohne in Prag.", "Ich wohne in Berlin.", "Ich wohne in Brünn."],
                "traps": [
                    { "trigger": "wohne bei", "fix": "Pokud mluvíš o městě, používá se předložka 'in' (v). Předložka 'bei' znamená 'u někoho'. Správně: 'Ich wohne in Prag'." }
                ],
                "next": "konec"
            },
            "konec": {
                "bot_de": "Das ist super! Vielen Dank für das Gespräch. Bis bald!",
                "bot_cz": "To je skvělé! Děkuji moc za rozhovor. Brzy na shledanou!",
                "hints": ["Danke, bis bald!", "Tschüss!", "Auf Wiedersehen!"],
                "traps": [],
                "next": "start"
            }
        };

        let currentNode = "start";

        // Inicializace a offline hlas (Text-To-Speech)
        function mluv(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'de-DE';
                
                // Pokusí se vybrat ženský hlas, pokud je v systému dostupný
                const voices = window.speechSynthesis.getVoices();
                const femaleVoice = voices.find(v => v.lang.startsWith('de') && (v.name.includes('Female') || v.name.includes('Zira') || v.name.includes('Google')));
                if (femaleVoice) utterance.voice = femaleVoice;

                window.speechSynthesis.speak(utterance);
            }
        }

        // Vykreslení zprávy bota
        function renderBotMessage(nodeKey, correctionText = "") {
            const node = conversationTree[nodeKey];
            const chatArea = document.getElementById("chatArea");

            let correctionHtml = "";
            if (correctionText) {
                correctionHtml = `<div class="correction-box">⚠️ <b>Oprava chyb:</b> ${correctionText}</div>`;
            }

            const msgDiv = document.createElement("div");
            msgDiv.className = "msg msg-bot";
            msgDiv.innerHTML = `
                ${correctionHtml}
                <div>${node.bot_de}</div>
                <span class="translation-toggle" onclick="toggleTranslation(this)">👁️ Zobrazit český překlad</span>
                <div class="translation-text">${node.bot_cz}</div>
            `;
            
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;

            // Spuštění německé výslovnosti
